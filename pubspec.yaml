name: a_eye
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  google_mlkit_commons: 0.2.0
  camera: ^0.10.5+9
  collection: ^1.18.0
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.0
  flutter_tts: ^4.0.2
  font_awesome_flutter: ^10.6.0
  geolocator: ^13.0.1
  google_fonts: ^6.1.0
  google_mlkit_face_detection: ^0.5.0
  google_mlkit_text_recognition: 
    path: packages/google_mlkit_text_recognition
  google_mlkit_object_detection: 
    path: packages/google_mlkit_object_detection
  image: 3.2.0
  image_picker: ^1.0.7
  logger: ^1.4.0
  lottie: ^3.1.2
  path: ^1.8.3
  path_provider: ^2.1.1
  permission_handler: ^11.3.1
  quiver: ^3.2.1
  # shake: ^2.2.0
  stacked: ^3.4.0 
  stacked_services: ^1.1.0
  # telephony: ^0.2.0
  tflite_flutter: ^0.9.0
  tflite_flutter_helper:
    path: packages/tflite_flutter_helper
  volume_controller: ^2.0.7

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Eye Center Logo Template Design-Photoroom.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
 

flutter:
  uses-material-design: true

  assets:
    - assets/ml/
    - assets/

